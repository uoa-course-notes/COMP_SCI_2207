<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Second lectures on CSS!</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width ,initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="./style.css">

        <style>
            div {
                background-color: skyblue;
                color: grey;
                border-color: blue;
            }

        </style>


    </head>

    <body>
        <h1 style="color:red; 
                  font-family: Noto sans;">Second lecture on CSS!</h1>

        <div>
            <h1>Colours</h1>
        </div>

        <div style="background-color: mediumseaGreen;">MediumSeaGreen</div>
        <div style="background-color:lightsteelblue;">LightSteelBlue</div>
        <div style="background-color: Tomato;">Tomato</div>
        <br>

        <div style="background-color: rgb(60,179,113)">rgb(60,179,113)</div>
        <div style="background-color: rgb(176, 196, 222)">rgb(176, 196, 222)</div>
        <div style="background-color: rgb(255, 99, 71)">rgb(255, 99, 71)</div>
        <br>

        <div style="background-color: #3cb371;">#3cb371</div>
        <div style="background-color: #b0c4de;">#bd0c4de</div>
        <div style="background-color: #ff6347;">#ff6347</div>
        <br>

        <!-- hsl := (hue, saturation, lightness) where
            0 <= hue <= 360 (o: red, 120: green, 250 blue), saturation (0: gray, 100: full color) and lightness are percentages 
        -->
        <div style="background-color: hsl(147, 50%, 47%);">hsl(147, 50%, 47%)</div>
        <div style="background-color: hsl(240, 41%, 75%);">hsl(240, 41%, 75%)</div>
        <div style="background-color: hsl(9, 100%, 64%);">hsl(9, 100%, 64%)</div>
        <br>

        <div style="background-color: rgba(60,179,113, 100)">rgb(60,179,113, 100)</div>
        <div style="background-color: rgba(176, 196, 222, 100)">rgb(176, 196, 222, 100)</div>
        <div style="background-color: rgba(255, 99, 71, 100)">rgb(255, 99, 71, 100)</div>


        <!-- anything that can apply a style can have a background -->
        <div style="background-color: Salon;;">Some content</div>
        <br>
        <!-- <div style="background-image: url(https://unsplash.com/photos/3d-render-abstract-pink-blue-neon-background-cosmic-landscape-northern-polar-lights-esoteric-rectangular-portal-virtual-reality-ultraviolet-spectrum-rocks-daGw0XcpzqI);">Some more content</div>
        <br>
        <div style="background-image:  linear-gradient(to right. skyblue);">Even more content</div> -->

    </body>


</html>
