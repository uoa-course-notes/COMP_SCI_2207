<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajax</title>
</head>
<body>
    <button type="button" onclick="showCountries()">Show Countries</button>
    <div id="feed"></div>
    <script>
        function showCountries(){
            let xhr = new XMLHttpRequest(); // xhr := xml http request 
            xhr.open('GET', 'https://restcountries.com/v3.1/all', true); // use open() to initialize a request 
            // true ==> asynchronous function 
            
            // Creating a callback() function to handle response's status code 
            xhr.onload = function(){
                if (xhr.status === 200){
                    console.log('Success');
                    let countries = JSON.parse(this.response);
                    
                    console.log("Retrieved: ");
                    console.log(countries);
                    // console.log("which is of type: " , typeof(countries));
                    countries.forEach(country => {
                        const countryCard = document.createElement('div');
                        const countryCardImage = document.createElement('img');
                        countryCard.innerHTML = country.name.common;
                        countryCardImage.src= country.flags.png;
                        // console.log(country.flags.png);
                        // console.log(country.name.common);
                        document.getElementById("feed").append(countryCard, countryCardImage);
                    });
                }
            };
            xhr.send(); //sending the request. 
        }
    </script>
</body>
</html>
